# SQL Server for running the API and the tests without LocalDB (Windows / Mac / Linux).
# Local development only – the password below is not a secret.
#   docker compose up -d       start (the healthcheck reports "healthy" when SQL Server accepts logins)
#   docker compose down -v     stop and delete the data
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: requests-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Requests_Dev_123!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  sqlserver-data:
